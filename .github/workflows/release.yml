name: Release
on:
  push: {tags: ['v*.*.*']}
  workflow_dispatch:
    inputs: {tag: {description: Existing vX.Y.Z tag, required: true, type: string}}
permissions: {contents: read}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
env:
  REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      commit: ${{ steps.revision.outputs.value }}
    strategy: {matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - id: tag
        shell: bash
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}"
          git merge-base --is-ancestor "$REQUESTED_TAG" origin/main
          echo "value=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - id: revision
        shell: bash
        env:
          SANITIZED_TAG: ${{ steps.tag.outputs.value }}
        run: echo "value=$(git rev-parse "$SANITIZED_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.revision.outputs.value }}
        run: git checkout --detach "$RELEASE_COMMIT"
      - run: mise run check
      - shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$version" = "$(uv run --locked python -c 'import sys; print(sys.argv[1].split()[-1])' "$(./odindeps --version)")"
          test "$version" = "$(uv run --locked python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          grep -F "## [$version]" CHANGELOG.md
          test -x odindeps && test "$(head -n 1 odindeps)" = '#!/usr/bin/env python3' && cp odindeps /tmp/odindeps && /tmp/odindeps --help
        if: runner.os != 'Windows'
      - shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ((python ./odindeps --version) -ne "odindeps $version") { exit 1 }
          Copy-Item ./odindeps, ./odindeps.cmd $env:TEMP
          Push-Location $env:TEMP
          if ((.\odindeps.cmd --version) -ne "odindeps $version") { exit 1 }
          Pop-Location
        if: runner.os == 'Windows'
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.verify.outputs.commit }}', fetch-depth: 0, persist-credentials: false}
      - run: sha256sum odindeps odindeps.cmd > odindeps.sha256
      - name: Publish immutable assets
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          version="${RELEASE_TAG#v}"
          python3 - "$version" <<'PY' > release-notes.md
          import sys
          from pathlib import Path

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          release_heading = f"## [{version}]"
          start = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line == release_heading or line.startswith(f"{release_heading} - ")
              ),
              None,
          )
          if start is None:
              raise SystemExit(f"missing changelog section for {version}")
          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## [")),
              len(lines),
          )
          section = "\n".join(lines[start:end]).strip()
          if section == release_heading:
              raise SystemExit(f"empty changelog section for {version}")
          print(section)
          PY
          {
            printf '\n\nVerify both assets with: sha256sum --check odindeps.sha256\n'
            printf 'Install from: https://github.com/%s/releases/download/%s/odindeps\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          } >> release-notes.md

          release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ -z "$release_state" ]; then
            gh release create "$RELEASE_TAG" odindeps odindeps.cmd odindeps.sha256 --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --draft
            release_state=true
          elif [ "$release_state" = true ]; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" odindeps odindeps.cmd odindeps.sha256 --clobber
          fi

          actual_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          expected_assets="$(printf '%s\n' odindeps odindeps.cmd odindeps.sha256 | sort)"
          test "$actual_assets" = "$expected_assets"
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --pattern odindeps --pattern odindeps.cmd --pattern odindeps.sha256 --dir downloaded
          (cd downloaded && sha256sum --check odindeps.sha256)
          cmp odindeps downloaded/odindeps
          cmp odindeps.cmd downloaded/odindeps.cmd
          if [ "$release_state" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
