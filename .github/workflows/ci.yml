name: CI
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: mise run check
      - shell: bash
        run: test -x odindeps && test "$(head -n 1 odindeps)" = '#!/usr/bin/env python3' && cp odindeps /tmp/odindeps && /tmp/odindeps --help
        if: runner.os != 'Windows'
      - shell: pwsh
        run: |
          Copy-Item odindeps, odindeps.cmd $env:TEMP
          python $env:TEMP/odindeps --help
          Push-Location $env:TEMP
          .\odindeps.cmd --help
          Pop-Location
        if: runner.os == 'Windows'
      - name: Materialize the filtered clone on Windows
        working-directory: examples/odin-collection-import/myproject
        shell: pwsh
        run: |
          python ../../../odindeps sync
          if (!(Test-Path third_party/slog/LICENSE -PathType Leaf)) { exit 1 }
          if (!(Test-Path third_party/slog/slog.odin -PathType Leaf)) { exit 1 }
          if (Test-Path third_party/slog/.git) { exit 1 }
        if: runner.os == 'Windows'
  odin-examples:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - working-directory: examples/odin-collection-import/myproject
        run: mise install
      - working-directory: examples/odin-collection-import/myproject
        run: |
          mise run install
          mise run sync
          test -f third_party/slog/LICENSE
          test -f third_party/slog/slog.odin
          test ! -e third_party/slog/tests
          test ! -e third_party/slog/examples
          test ! -e third_party/slog/json_internal_test.odin
          test ! -e third_party/slog/.git
          mise run verify
      - working-directory: examples/odin-relative-import/myproject
        run: |
          python ../../../odindeps sync
          test -f src/third_party/slog/LICENSE
          test ! -e src/third_party/slog/tests
          test ! -e src/third_party/slog/examples
          mise exec odin@dev-2026-07a -- odin run src
