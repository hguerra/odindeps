[tools]
python = "3.14.6"
uv = "0.11.32"

[tasks."test:unit"]
run = "uv run --locked python -m unittest discover -s tests/unit -p 'test_*.py'"

[tasks."test:integration"]
run = "uv run --locked python -m unittest discover -s tests/integration -p 'test_*.py'"

[tasks.test]
run = "uv run --locked python -m unittest discover -s tests -p 'test_*.py'"

[tasks.lint]
run = "uv run --locked ruff check odindeps tests"

[tasks.format]
run = "uv run --locked ruff format odindeps tests"

[tasks."format-check"]
run = "uv run --locked ruff format --check odindeps tests"

[tasks.check]
depends = ["lint", "format-check", "test"]
run = "uv run --locked python -m py_compile odindeps"
